version: 2

# One weekly PR for routine dependency upgrades across all managed ecosystems.
# Security fixes remain eligible for separate, promptly raised PRs.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    groups:
      security-fixes:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    groups:
      security-fixes:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directory: "/infra/bootstrap/gcp"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    groups:
      security-fixes:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directory: "/infra/docker-host/gcp"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    groups:
      security-fixes:
        applies-to: "security-updates"
        patterns: ["*"]
