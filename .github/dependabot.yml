version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: /infra/bootstrap/gcp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /infra/docker-host/gcp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
