name: Deploy model garden

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      target_cloud:
        description: Cloud target; auto deploys every fully configured credential set
        required: true
        default: auto
        type: choice
        options: [auto, aws, gcp, azure, all]
      environment:
        description: Client environment name
        required: true
        default: dev
        type: choice
        options: [dev, test, staging, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: model-garden-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  detect-clouds:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
    steps:
      - name: Detect configured clouds
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.target_cloud }}"
          clouds=()

          aws_ready=false
          gcp_ready=false
          azure_ready=false
          [[ -n "$AWS_ROLE_ARN" && -n "$AWS_REGION" ]] && aws_ready=true
          [[ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" && -n "$GCP_SERVICE_ACCOUNT" && -n "$GCP_PROJECT_ID" && -n "$GCP_REGION" ]] && gcp_ready=true
          [[ -n "$AZURE_CLIENT_ID" && -n "$AZURE_TENANT_ID" && -n "$AZURE_SUBSCRIPTION_ID" && -n "$AZURE_LOCATION" ]] && azure_ready=true

          add_if_ready() {
            local cloud="$1" ready="$2"
            if [[ "$ready" == true ]]; then
              clouds+=("$cloud")
            elif [[ "$target" == "$cloud" ]]; then
              echo "Requested $cloud but its credential set is incomplete. See docs/secrets.md." >&2
              exit 1
            fi
          }

          case "$target" in
            auto|all)
              add_if_ready aws "$aws_ready"
              add_if_ready gcp "$gcp_ready"
              add_if_ready azure "$azure_ready"
              ;;
            aws) add_if_ready aws "$aws_ready" ;;
            gcp) add_if_ready gcp "$gcp_ready" ;;
            azure) add_if_ready azure "$azure_ready" ;;
            *) echo "Unsupported target: $target" >&2; exit 2 ;;
          esac

          if [[ ${#clouds[@]} -eq 0 ]]; then
            echo "No complete cloud credential set found. See docs/secrets.md." >&2
            exit 1
          fi

          json="$(jq -cn '$ARGS.positional' --args "${clouds[@]}")"
          matrix="$(jq -cn --argjson clouds "$json" '{cloud:$clouds}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Configured deployment targets: ${clouds[*]}"

  deploy:
    needs: detect-clouds
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-clouds.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      CLIENT_SLUG: ${{ vars.CLIENT_SLUG || 'client' }}
      ENVIRONMENT: ${{ inputs.environment }}
      K8S_NODE_COUNT: ${{ vars.K8S_NODE_COUNT || '2' }}
      GATEWAY_REPLICAS: ${{ vars.GATEWAY_REPLICAS || '2' }}
      GATEWAY_SERVICE_TYPE: ${{ vars.GATEWAY_SERVICE_TYPE || 'ClusterIP' }}
      LITELLM_IMAGE: ${{ vars.LITELLM_IMAGE || 'ghcr.io/berriai/litellm:v1.99.1' }}

      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}

      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL_REF: ${{ secrets.OPENAI_MODEL_REF }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL_REF: ${{ secrets.ANTHROPIC_MODEL_REF }}
      OPEN_WEIGHT_API_BASE: ${{ secrets.OPEN_WEIGHT_API_BASE }}
      OPEN_WEIGHT_MODEL_REF: ${{ secrets.OPEN_WEIGHT_MODEL_REF }}
      OPEN_WEIGHT_API_KEY: ${{ secrets.OPEN_WEIGHT_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to AWS with OIDC
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authenticate to GCP with Workload Identity Federation
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install gcloud
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate to Azure with OIDC
        if: matrix.cloud == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Bootstrap remote state
        shell: bash
        run: |
          chmod +x scripts/*.sh
          scripts/bootstrap-state.sh "${{ matrix.cloud }}" /tmp/backend.hcl

      - name: Terraform init and validate
        shell: bash
        run: |
          set -euo pipefail
          cloud="${{ matrix.cloud }}"
          export TF_IN_AUTOMATION=true
          export TF_VAR_client_slug="$CLIENT_SLUG"
          export TF_VAR_environment="$ENVIRONMENT"
          export TF_VAR_node_count="$K8S_NODE_COUNT"
          export TF_VAR_platform_version="$(tr -d '\n' < VERSION)"

          case "$cloud" in
            aws) export TF_VAR_region="$AWS_REGION" ;;
            gcp) export TF_VAR_project_id="$GCP_PROJECT_ID" TF_VAR_region="$GCP_REGION" ;;
            azure) export TF_VAR_subscription_id="$AZURE_SUBSCRIPTION_ID" TF_VAR_location="$AZURE_LOCATION" ;;
          esac

          env | grep '^TF_VAR_' >> "$GITHUB_ENV"
          terraform -chdir="infra/$cloud" init -input=false -backend-config=/tmp/backend.hcl
          terraform -chdir="infra/$cloud" fmt -check
          terraform -chdir="infra/$cloud" validate

      - name: Best-effort portable runtime cleanup before destroy
        if: inputs.action == 'destroy'
        shell: bash
        run: |
          set +e
          cloud="${{ matrix.cloud }}"
          cluster="$(terraform -chdir="infra/$cloud" output -raw cluster_name 2>/dev/null)" || exit 0
          case "$cloud" in
            aws) aws eks update-kubeconfig --name "$cluster" --region "$AWS_REGION" ;;
            gcp)
              location="$(terraform -chdir=infra/gcp output -raw location)"
              gcloud container clusters get-credentials "$cluster" --zone "$location" --project "$GCP_PROJECT_ID"
              ;;
            azure)
              group="$(terraform -chdir=infra/azure output -raw resource_group)"
              az aks get-credentials --resource-group "$group" --name "$cluster" --admin --overwrite-existing
              ;;
          esac
          kubectl delete -k platform/k8s --ignore-not-found --wait=false
          kubectl -n model-garden delete configmap litellm-config secret model-garden-secrets --ignore-not-found

      - name: Terraform ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          cloud="${{ matrix.cloud }}"
          if [[ "${{ inputs.action }}" == "destroy" ]]; then
            terraform -chdir="infra/$cloud" plan -destroy -input=false -out=/tmp/tfplan
            terraform -chdir="infra/$cloud" apply -input=false -auto-approve /tmp/tfplan
          else
            terraform -chdir="infra/$cloud" plan -input=false -out=/tmp/tfplan
            if [[ "${{ inputs.action }}" == "apply" ]]; then
              terraform -chdir="infra/$cloud" apply -input=false -auto-approve /tmp/tfplan
            fi
          fi

      - name: Configure EKS kubeconfig
        if: inputs.action == 'apply' && matrix.cloud == 'aws'
        run: |
          cluster="$(terraform -chdir=infra/aws output -raw cluster_name)"
          aws eks update-kubeconfig --name "$cluster" --region "$AWS_REGION"

      - name: Configure GKE kubeconfig
        if: inputs.action == 'apply' && matrix.cloud == 'gcp'
        run: |
          cluster="$(terraform -chdir=infra/gcp output -raw cluster_name)"
          location="$(terraform -chdir=infra/gcp output -raw location)"
          gcloud container clusters get-credentials "$cluster" --zone "$location" --project "$GCP_PROJECT_ID"

      - name: Configure AKS kubeconfig
        if: inputs.action == 'apply' && matrix.cloud == 'azure'
        run: |
          cluster="$(terraform -chdir=infra/azure output -raw cluster_name)"
          group="$(terraform -chdir=infra/azure output -raw resource_group)"
          az aks get-credentials --resource-group "$group" --name "$cluster" --admin --overwrite-existing

      - name: Deploy portable model gateway
        if: inputs.action == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          : "${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}"
          case "$GATEWAY_SERVICE_TYPE" in ClusterIP|LoadBalancer) ;; *) echo "GATEWAY_SERVICE_TYPE must be ClusterIP or LoadBalancer" >&2; exit 2 ;; esac

          kubectl apply -f platform/k8s/namespace.yaml
          scripts/render-model-config.sh /tmp/config.yaml

          kubectl -n model-garden create configmap litellm-config \
            --from-file=config.yaml=/tmp/config.yaml \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n model-garden create secret generic model-garden-secrets \
            --from-literal=LITELLM_MASTER_KEY="$LITELLM_MASTER_KEY" \
            --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
            --from-literal=ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}" \
            --from-literal=OPEN_WEIGHT_API_BASE="${OPEN_WEIGHT_API_BASE:-}" \
            --from-literal=OPEN_WEIGHT_API_KEY="${OPEN_WEIGHT_API_KEY:-}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -k platform/k8s
          kubectl -n model-garden set image deployment/model-garden-gateway litellm="$LITELLM_IMAGE"
          kubectl -n model-garden scale deployment/model-garden-gateway --replicas="$GATEWAY_REPLICAS"
          kubectl -n model-garden patch service model-garden-gateway --type merge -p "{\"spec\":{\"type\":\"$GATEWAY_SERVICE_TYPE\"}}"
          kubectl -n model-garden rollout status deployment/model-garden-gateway --timeout=5m

          echo "### ${{ matrix.cloud }} deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Platform version: $(cat VERSION)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl -n model-garden get deployment,pod,service,pdb >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
