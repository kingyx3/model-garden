name: Legacy Kubernetes multi-cloud reference validation

# Historical/reference path only.
# New Model Garden clients use the generated keyless GCP Docker-host workflow
# from scripts/launch.py. This workflow is intentionally manual and is not a
# release gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-reference:
    name: legacy terraform (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - infra/aws
          - infra/gcp
          - infra/azure
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=${{ matrix.path }} fmt -check
      - name: Init without backend
        run: terraform -chdir=${{ matrix.path }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=${{ matrix.path }} validate

  kubernetes-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render legacy Kubernetes reference manifests
        run: kubectl kustomize platform/k8s >/tmp/model-garden-legacy-k8s.yaml
      - name: Render legacy LiteLLM gateway configuration
        env:
          OPENAI_API_KEY: test-openai
          OPENAI_MODEL_REF: openai/test-model
          ANTHROPIC_API_KEY: test-anthropic
          ANTHROPIC_MODEL_REF: anthropic/test-model
          OPEN_WEIGHT_API_BASE: https://example.invalid/v1
          OPEN_WEIGHT_MODEL_REF: openai/test-open-weight
          OPEN_WEIGHT_API_KEY: test-open-weight
        run: |
          scripts/render-model-config.sh /tmp/litellm-config.yaml
          grep -q 'general.openai' /tmp/litellm-config.yaml
          grep -q 'general.anthropic' /tmp/litellm-config.yaml
          grep -q 'general.open-weight' /tmp/litellm-config.yaml
