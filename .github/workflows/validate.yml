name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - infra/aws
          - infra/gcp
          - infra/azure
          - infra/bootstrap/gcp
          - infra/docker-host/gcp
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=${{ matrix.path }} fmt -check
      - name: Init without backend
        run: terraform -chdir=${{ matrix.path }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=${{ matrix.path }} validate

  contracts-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install contract validator dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate versioned contracts and reference workspace
        run: python3 scripts/validate-workspace.py examples/workspace
      - name: Test tiny workspace compiler and Hermes adapter
        run: python3 -m unittest discover -s tests -v
      - name: Run Receptionist reference acceptance evals
        run: python3 scripts/eval-receptionist.py examples/workspace
      - name: Compile reference Agent desired state
        run: |
          python3 scripts/compile-workspace.py examples/workspace --agent account-researcher --output /tmp/account-researcher.json
          grep -q '"name": "account-researcher"' /tmp/account-researcher.json
          grep -q '"name": "reasoning.high"' /tmp/account-researcher.json
          python3 scripts/compile-workspace.py examples/workspace --agent receptionist --output /tmp/receptionist.json
          grep -q '"name": "receptionist"' /tmp/receptionist.json
          grep -q '"name": "book-appointment"' /tmp/receptionist.json
          grep -q '"name": "calendar.book"' /tmp/receptionist.json
          grep -q '"name": "business-information"' /tmp/receptionist.json
      - name: Materialize reference Hermes profile
        run: |
          python3 scripts/provision-hermes-profile.py /tmp/receptionist.json /tmp/hermes-receptionist
          grep -q 'approved-openai-model' /tmp/hermes-receptionist/config.yaml
          grep -q 'Do not invent availability' /tmp/hermes-receptionist/skills/model-garden/book-appointment/SKILL.md
          test ! -e /tmp/hermes-receptionist/.env
          python3 scripts/provision-hermes-profile.py /tmp/receptionist.json /tmp/hermes-receptionist | grep -q 'already matches desired state'
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Smoke-test model config renderer
        env:
          OPENAI_API_KEY: test-openai
          OPENAI_MODEL_REF: openai/test-model
          ANTHROPIC_API_KEY: test-anthropic
          ANTHROPIC_MODEL_REF: anthropic/test-model
          OPEN_WEIGHT_API_BASE: https://example.invalid/v1
          OPEN_WEIGHT_MODEL_REF: openai/test-open-weight
          OPEN_WEIGHT_API_KEY: test-open-weight
        run: |
          chmod +x scripts/render-model-config.sh
          scripts/render-model-config.sh /tmp/config.yaml
          grep -q 'general.openai' /tmp/config.yaml
          grep -q 'general.anthropic' /tmp/config.yaml
          grep -q 'general.open-weight' /tmp/config.yaml
      - name: Validate Kubernetes manifests render
        run: kubectl kustomize platform/k8s >/tmp/model-garden.yaml

  hermes-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Model Garden validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Smoke-test pinned Hermes runtime against Receptionist profile
        run: bash scripts/smoke-hermes-runtime.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [terraform, contracts-and-runtime, hermes-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches VERSION
        run: python3 scripts/validate-release-tag.py "$GITHUB_REF_NAME"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Model Garden $GITHUB_REF_NAME"
