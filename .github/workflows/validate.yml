name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  version-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify VERSION is safe to publish or matches this tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag="v${version}"
          remote="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          if [[ -z "$remote" ]]; then
            echo "${tag} is not published yet; this revision may publish it after validation."
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "${tag} is already published. Bump VERSION before merging another change so client lockfiles never point at stale code." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == "refs/tags/${tag}" && "$remote" == "$GITHUB_SHA" ]]; then
            echo "Tag ${tag} matches this revision."
            exit 0
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$remote" == "$GITHUB_SHA" ]]; then
            echo "Main already matches published ${tag}."
            exit 0
          fi
          echo "${tag} already points to ${remote}, not ${GITHUB_SHA}. Bump VERSION before changing main." >&2
          exit 1

  current-terraform:
    name: terraform (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - infra/bootstrap/gcp
          - infra/docker-host/gcp
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=${{ matrix.path }} fmt -check
      - name: Init without backend
        run: terraform -chdir=${{ matrix.path }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=${{ matrix.path }} validate

  contracts-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install contract validator dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate versioned contracts and reference workspace
        run: python3 scripts/validate-workspace.py examples/workspace
      - name: Test workspace, runtime, governance and operator paths
        run: python3 -m unittest discover -s tests -v
      - name: Run Receptionist reference acceptance evals
        run: python3 scripts/eval-receptionist.py examples/workspace
      - name: Compile reference Agent desired state
        run: |
          python3 scripts/compile-workspace.py examples/workspace --agent account-researcher --output /tmp/account-researcher.json
          grep -q '"name": "account-researcher"' /tmp/account-researcher.json
          grep -q '"name": "reasoning.high"' /tmp/account-researcher.json
          python3 scripts/compile-workspace.py examples/workspace --agent receptionist --output /tmp/receptionist.json
          grep -q '"name": "receptionist"' /tmp/receptionist.json
          grep -q '"name": "book-appointment"' /tmp/receptionist.json
          grep -q '"name": "calendar.book"' /tmp/receptionist.json
          grep -q '"name": "business-information"' /tmp/receptionist.json
      - name: Materialize reference Hermes profile
        run: |
          python3 scripts/provision-hermes-profile.py /tmp/receptionist.json /tmp/hermes-receptionist
          grep -q 'approved-openai-model' /tmp/hermes-receptionist/config.yaml
          grep -q 'Do not invent availability' /tmp/hermes-receptionist/skills/model-garden/book-appointment/SKILL.md
          test ! -e /tmp/hermes-receptionist/.env
          python3 scripts/provision-hermes-profile.py /tmp/receptionist.json /tmp/hermes-receptionist | grep -q 'already matches desired state'
      - name: Validate shell scripts
        run: bash -n scripts/*.sh

  enterprise-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install assurance dependencies
        run: python3 -m pip install -r requirements-dev.txt pip-audit
      - name: Validate assurance registry and repository guardrails
        run: |
          python3 scripts/enterprise-evidence.py verify
          python3 scripts/enterprise-evidence.py scan
      - name: Audit runtime Python dependencies
        id: dependency_audit
        shell: bash
        run: |
          mkdir -p /tmp/model-garden-enterprise-evidence
          set +e
          pip-audit -r requirements-runtime.txt --format json --output /tmp/model-garden-enterprise-evidence/pip-audit.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Generate enterprise evidence pack
        run: |
          python3 scripts/enterprise-evidence.py pack \
            --output /tmp/model-garden-enterprise-evidence \
            --pip-audit /tmp/model-garden-enterprise-evidence/pip-audit.json
      - name: Upload enterprise evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-evidence-${{ github.sha }}
          path: /tmp/model-garden-enterprise-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Enforce dependency vulnerability result
        if: steps.dependency_audit.outputs.exit_code != '0'
        run: |
          echo "pip-audit found a runtime dependency vulnerability or could not complete successfully." >&2
          exit 1

  hermes-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Model Garden validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Smoke-test pinned Hermes runtime against Receptionist profile
        run: bash scripts/smoke-hermes-runtime.sh

  publish-main-release:
    if: github.ref == 'refs/heads/main'
    needs: [version-contract, current-terraform, contracts-and-runtime, enterprise-assurance, hermes-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish validated VERSION from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          remote="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          if [[ -n "$remote" && "$remote" != "$GITHUB_SHA" ]]; then
            echo "${tag} already points to ${remote}; refusing to move an existing release tag." >&2
            exit 1
          fi
          if [[ -z "$remote" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
          else
            gh release create "$tag" --verify-tag --generate-notes --title "Model Garden ${tag}"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-contract, current-terraform, contracts-and-runtime, enterprise-assurance, hermes-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches VERSION
        run: python3 scripts/validate-release-tag.py "$GITHUB_REF_NAME"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Model Garden $GITHUB_REF_NAME"
          fi
