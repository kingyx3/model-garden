name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  version-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify VERSION is safe to publish or matches this tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag="v${version}"
          remote="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          if [[ -z "$remote" ]]; then
            echo "${tag} is not published yet; this revision may publish it after validation."
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "${tag} is already published. Bump VERSION before merging another change so client lockfiles never point at stale code." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == "refs/tags/${tag}" && "$remote" == "$GITHUB_SHA" ]]; then
            echo "Tag ${tag} matches this revision."
            exit 0
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$remote" == "$GITHUB_SHA" ]]; then
            echo "Main already matches published ${tag}."
            exit 0
          fi
          echo "${tag} already points to ${remote}, not ${GITHUB_SHA}. Bump VERSION before changing main." >&2
          exit 1

  current-terraform:
    name: terraform (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - infra/bootstrap/gcp
          - infra/docker-host/gcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=${{ matrix.path }} fmt -check
      - name: Init without backend
        run: terraform -chdir=${{ matrix.path }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=${{ matrix.path }} validate

  contracts-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install contract validator dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate versioned contracts and reference workspace
        run: python3 scripts/validate-workspace.py examples/workspace
      - name: Test workspace, runtime, governance and operator paths
        run: python3 -m unittest discover -s tests -v
      - name: Run Receptionist reference acceptance evals
        run: python3 scripts/eval-receptionist.py examples/workspace
      - name: Compile reference Agent desired state
        run: |
          python3 scripts/compile-workspace.py examples/workspace --agent account-researcher --output /tmp/account-researcher.json
          grep -q '"name": "account-researcher"' /tmp/account-researcher.json
          grep -q '"name": "reasoning.high"' /tmp/account-researcher.json
          python3 scripts/compile-workspace.py examples/workspace --agent receptionist --output /tmp/receptionist.json
          grep -q '"name": "receptionist"' /tmp/receptionist.json
          grep -q '"name": "book-appointment"' /tmp/receptionist.json
          grep -q '"name": "calendar.book"' /tmp/receptionist.json
          grep -q '"name": "business-information"' /tmp/receptionist.json
      - name: Materialize reference Hermes profile
        run: |
          python3 scripts/provision-hermes-profile.py /tmp/receptionist.json /tmp/hermes-receptionist
          grep -q 'approved-openai-model' /tmp/hermes-receptionist/config.yaml
          grep -q 'Do not invent availability' /tmp/hermes-receptionist/skills/model-garden/book-appointment/SKILL.md
          test ! -e /tmp/hermes-receptionist/.env
          python3 scripts/provision-hermes-profile.py /tmp/receptionist.json /tmp/hermes-receptionist | grep -q 'already matches desired state'
      - name: Validate shell scripts
        run: bash -n scripts/*.sh

  hermes-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Model Garden validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Smoke-test pinned Hermes runtime against Receptionist profile
        run: bash scripts/smoke-hermes-runtime.sh

  enterprise-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install assurance dependencies
        run: python3 -m pip install -r requirements-dev.txt -r requirements-assurance.txt
      - name: Generate scanner evidence and enforce enterprise thresholds
        id: assurance
        continue-on-error: true
        run: bash scripts/run-assurance-scans.sh --enforce
      - name: Verify evidence pack exists
        if: always()
        run: |
          test -s .enterprise-evidence/enterprise-evidence-pack.md
          test -s .enterprise-evidence/manifest.json
          python3 -m json.tool .enterprise-evidence/manifest.json >/dev/null
      - name: Archive evidence snapshot
        if: always()
        run: tar -C .enterprise-evidence -czf "enterprise-evidence-${GITHUB_SHA}.tgz" .
      - name: Upload enterprise evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-evidence-${{ github.sha }}
          path: |
            .enterprise-evidence/
            enterprise-evidence-${{ github.sha }}.tgz
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Attest evidence provenance
        if: github.event_name != 'pull_request' && steps.assurance.outcome == 'success'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: enterprise-evidence-${{ github.sha }}.tgz
      - name: Enforce assurance result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.assurance.outcome }}" != "success" ]]; then
            echo "Enterprise assurance thresholds failed. Review the retained evidence artifact." >&2
            exit 1
          fi

  # The repository ruleset already requires this status context. Keep it as an
  # aggregator so enterprise-evidence failures are merge-blocking without a second
  # mutable source of branch-protection configuration.
  contracts-and-runtime:
    needs: [contracts-runtime-tests, enterprise-evidence]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Runtime/contracts and enterprise assurance gates passed."

  publish-main-release:
    if: github.ref == 'refs/heads/main'
    needs: [version-contract, current-terraform, contracts-and-runtime, hermes-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish validated VERSION from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          remote="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          if [[ -n "$remote" && "$remote" != "$GITHUB_SHA" ]]; then
            echo "${tag} already points to ${remote}; refusing to move an existing release tag." >&2
            exit 1
          fi
          if [[ -z "$remote" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
          else
            gh release create "$tag" --verify-tag --generate-notes --title "Model Garden ${tag}"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-contract, current-terraform, contracts-and-runtime, hermes-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches VERSION
        run: python3 scripts/validate-release-tag.py "$GITHUB_REF_NAME"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Model Garden $GITHUB_REF_NAME"
          fi
