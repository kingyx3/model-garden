apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-garden-gateway
  namespace: model-garden
  labels:
    app: model-garden-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-garden-gateway
  template:
    metadata:
      labels:
        app: model-garden-gateway
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.99.1
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: model-garden-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
