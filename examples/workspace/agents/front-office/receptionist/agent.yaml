apiVersion: modelgarden.ai/v1
kind: Agent
metadata:
  name: receptionist
  owner: front-office
  team: front-office
  description: Answer inbound customer calls, handle approved enquiries, capture messages, book appointments, and hand off safely.
spec:
  model:
    profile: reasoning.high
  instructions:
    file: instructions.md
  skills:
    - answer-faq
    - take-message
    - human-handoff
    - book-appointment
    - log-conversation
  disabledSkills:
    - book-appointment  # Requires a proven, approved upstream MCP Calendar route.
  tools:
    - calendar.availability
    - calendar.book
    - kb.search
    - crm.create
    - crm.log-interaction
  knowledge:
    - business-information
    - rules-of-engagement
  policies:
    - default-agent-policy
  security:
    dataClassification: confidential
  approvals:
    externalActions: none
  evaluation:
    suite: evals/
    minimumScore: 0.9
