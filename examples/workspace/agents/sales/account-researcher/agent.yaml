apiVersion: modelgarden.ai/v1
kind: Agent
metadata:
  name: account-researcher
  owner: sales-operations
  team: sales
  description: Prepare a decision-ready account brief before customer meetings.
spec:
  model:
    profile: reasoning.high
  instructions:
    file: instructions.md
  skills:
    - account-summary
    - create-deliverable
  disabledSkills:
    - create-deliverable  # Opt in only after the client binds and approves docs.
  tools:
    - crm.read
    - docs.create
  knowledge:
    - sales-playbook
  policies:
    - default-agent-policy
  security:
    dataClassification: confidential
  approvals:
    externalActions: required
  evaluation:
    suite: evals/
    minimumScore: 0.9
