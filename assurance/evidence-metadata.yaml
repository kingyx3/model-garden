version: 1
updated: 2026-09-17

principles:
  - Repository and CI evidence is a snapshot of a specific commit, not proof of continuous compliance.
  - Manual, legal-entity, provider, client and certification facts must have explicit owners and review cadence.
  - Expired or absent evidence must remain visible; it must never be silently converted into a supported DDQ claim.

repository_snapshot:
  owner: Model Garden engineering
  verification: GitHub CI on each validated commit
  freshness: per_commit
  controls:
    - client_isolation
    - least_privilege
    - keyless_deployment
    - secret_management
    - governed_actions
    - auditability
    - human_oversight
    - versioning_and_rollback
    - secure_sdlc
    - ai_evaluation
    - ai_risk_bounding
    - ai_prompt_injection_controls

automated_checks:
  dependency_vulnerability_scan:
    owner: Model Garden engineering
    tool: pip-audit
    evidence_file: scans/pip-audit.json
    controls: [vulnerability_and_patch_management, secure_sdlc]
  python_security_scan:
    owner: Model Garden engineering
    tool: bandit
    evidence_file: scans/bandit.json
    controls: [secure_sdlc, vulnerability_and_patch_management]
  infrastructure_as_code_scan:
    owner: Model Garden engineering
    tool: checkov
    evidence_file: scans/checkov.json
    controls: [secure_sdlc, least_privilege, secret_management]
  repository_secret_scan:
    owner: Model Garden engineering
    tool: detect-secrets
    evidence_file: scans/detect-secrets.json
    controls: [secret_management, secure_sdlc]
  python_sbom:
    owner: Model Garden engineering
    tool: pip-audit CycloneDX output
    evidence_file: scans/python-sbom.cdx.json
    controls: [subprocessor_inventory, open_source_governance, vulnerability_and_patch_management]

manual_evidence:
  privacy_program:
    owner: Model Garden privacy/accountability owner
    review_interval_days: 90
    expected_evidence: DPO/accountability owner, privacy policies, data inventory, DSAR and breach procedures.
  subprocessor_inventory:
    owner: Model Garden operator
    review_interval_days: 90
    expected_evidence: Current provider/subprocessor, data-flow, residency, retention/training and replacement-path register.
  incident_response:
    owner: Model Garden operator
    review_interval_days: 180
    expected_evidence: Incident runbook review and retained incident/tabletop evidence where available.
  business_continuity:
    owner: Model Garden operator
    review_interval_days: 180
    expected_evidence: Backup/restore, rollback and recovery test records plus agreed RTO/RPO where applicable.
  penetration_testing:
    owner: Model Garden security owner
    review_interval_days: 365
    expected_evidence: Current independent penetration-test report or attestation and remediation record.
  formal_certifications:
    owner: Model Garden business/security owner
    review_interval_days: 365
    expected_evidence: Current in-scope certificate and surveillance/audit evidence.
  cyber_insurance:
    owner: Model Garden business owner
    review_interval_days: 365
    expected_evidence: Current policy/certificate of insurance and coverage period.
